<style>

.runB .sp-bubble{animation:spFadeB 300ms ease 3880ms both}
@media (prefers-reduced-motion: reduce){
  .runA *,.runB *{animation:none!important}
  .runA .sp-stage,.runB .sp-stage{animation:spFadeOutRM 300ms ease 1600ms both!important}
  .runA .sp-room,.runB .sp-room,.runA .sp-sheet,.runB .sp-sheet,.runA .sp-bubble,.runB .sp-bubble{animation:spFade 300ms ease 1600ms both!important}
  .sp-tung{display:none}

@keyframes spFadeOutRM{to{opacity:0}}
@keyframes spFade{0%{opacity:0}100%{opacity:1}}

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const S = this.state || {};
    const n = S.n || 0;
    return {
      run: n % 2 ? 'runB' : 'runA',
      replay: () => this.setState({ n: n + 1 })
    };
  }
}
</script>
