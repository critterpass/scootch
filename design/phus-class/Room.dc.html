<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Classroom, wide</title>

<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:'Kithfield Hand';src:url(assets/kithfield-hand-bold.woff2) format('woff2');font-weight:700;font-display:swap}
body{margin:0;overflow:hidden}
.rm-fan{transform-box:fill-box;transform-origin:center;animation:rmFan 1.1s linear infinite}
@keyframes rmFan{to{transform:rotate(360deg)}}
.rm-sway{transform-box:fill-box;transform-origin:50% 0;animation:rmSway 4s ease-in-out infinite}
@keyframes rmSway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.rm-pace{animation:rmPace 10s ease-in-out infinite}
@keyframes rmPace{0%,100%{transform:translateX(-170px)}45%,55%{transform:translateX(170px)}}
.rm-tick{transform-box:view-box;transform-origin:550px 56px;animation:rmTick 60s steps(60) infinite}
@keyframes rmTick{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.rm-fan,.rm-sway,.rm-pace,.rm-tick{animation:none}}
</style>
</helmet>
<div style="position: relative; width: {{wpx}}; height: {{hpx}}; overflow: hidden; background: #E8D2AE; transition: width 700ms cubic-bezier(.32,.72,0,1), height 700ms cubic-bezier(.32,.72,0,1)">

      <circle cx="1234" cy="350" r="34" fill="#6BBF7A"></circle>
      <circle cx="1204" cy="372" r="24" fill="#5AAE6A"></circle>
      <rect x="1220" y="126" width="4" height="270" fill="#FFFFFF"></rect>
      <rect x="1174" y="258" width="96" height="4" fill="#FFFFFF"></rect>

      <!-- wall fan -->
      <rect x="1424" y="214" width="12" height="54" rx="6" fill="#B8BCC6"></rect>
      <rect x="1406" y="262" width="48" height="16" rx="8" fill="#9EA3AE"></rect>
      <circle cx="1430" cy="170" r="62" fill="#EEF1F5" stroke="#B8BCC6" stroke-width="4"></circle>
      <g class="rm-fan"><path d="M1430 170 C1404 132 1418 116 1430 118 C1442 116 1456 132 1430 170 Z M1430 170 C1474 160 1484 176 1478 186 C1474 198 1452 204 1430 170 Z M1430 170 C1408 206 1388 200 1384 190 C1380 178 1392 162 1430 170 Z" fill="#7FB6E0"></path></g>
      <circle cx="1430" cy="170" r="12" fill="#5C8FBF"></circle>
      <path d="M1374 170 H1486 M1430 114 V226 M1390 130 L1470 210 M1470 130 L1390 210" stroke="#C9CDD5" stroke-width="2" opacity="0.6"></path>

      <!-- bookshelf and plant -->
      <rect x="1318" y="330" width="236" height="290" rx="6" fill="#8A5A36"></rect>
      <rect x="1330" y="342" width="212" height="80" fill="#6E4528"></rect>
      <rect x="1330" y="434" width="212" height="80" fill="#6E4528"></rect>
      <rect x="1330" y="526" width="212" height="82" fill="#6E4528"></rect>
      <g>
        <rect x="1338" y="356" width="16" height="66" rx="2" fill="#D42A24"></rect><rect x="1356" y="362" width="14" height="60" rx="2" fill="#4FB8F0"></rect><rect x="1372" y="350" width="18" height="72" rx="2" fill="#FFC93C"></rect><rect x="1392" y="364" width="14" height="58" rx="2" fill="#2F6B56"></rect><rect x="1414" y="370" width="60" height="14" rx="2" fill="#9B6BD1" transform="rotate(-18 1414 384)"></rect>
        <rect x="1338" y="452" width="20" height="62" rx="2" fill="#2B4C9A"></rect><rect x="1360" y="446" width="14" height="68" rx="2" fill="#F2A49B"></rect><rect x="1376" y="456" width="16" height="58" rx="2" fill="#4FAE6E"></rect><rect x="1394" y="450" width="18" height="64" rx="2" fill="#E0A030"></rect><circle cx="1490" cy="488" r="22" fill="#4FB8F0"></circle><path d="M1470 480 Q1490 470 1510 486 M1474 498 Q1492 504 1508 494" stroke="#6BBF7A" stroke-width="5" fill="none"></path><rect x="1484" y="508" width="12" height="8" fill="#8A5A36"></rect>
        <rect x="1340" y="550" width="70" height="56" rx="3" fill="#FFFDF6"></rect><rect x="1346" y="558" width="58" height="6" rx="3" fill="#E6DED2"></rect><rect x="1418" y="540" width="16" height="66" rx="2" fill="#D42A24"></rect><rect x="1436" y="546" width="14" height="60" rx="2" fill="#FFC93C"></rect>

      <rect x="450" y="602" width="700" height="32" fill="#A97848"></rect>

    <div class="{{paceCls}}" style="position: absolute; left: {{px}}; top: {{py}}; transition: left 700ms cubic-bezier(.32,.72,0,1), top 700ms cubic-bezier(.32,.72,0,1)">
      <dc-import name="Phu" mood="{{mood}}" walk="{{walk}}" size="230" hint-size="230px,253px"></dc-import>
    </div>

    <svg width="1600" height="1000" viewBox="0 0 1600 1000" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
      <path d="M600 408 L1000 408 L1016 442 L584 442 Z" fill="#E9B47C"></path>
      <rect x="584" y="440" width="432" height="4" fill="#F3C892"></rect>
      <rect x="584" y="444" width="432" height="144" fill="#C98B55"></rect>
      <rect x="584" y="444" width="432" height="8" fill="#B57744"></rect>
      <sc-for list="{{desks}}" as="d" hint-placeholder-count="10">
        <g><path d="{{d.top}}" fill="#E9B47C"></path><rect x="{{d.x}}" y="{{d.y}}" width="{{d.w}}" height="{{d.h}}" fill="#C98B55"></rect><rect x="{{d.l1}}" y="{{d.ly}}" width="9" height="{{d.lh}}" fill="#8A5A36"></rect><rect x="{{d.l2}}" y="{{d.ly}}" width="9" height="{{d.lh}}" fill="#8A5A36"></rect></g>

      <g fill="none" stroke="#A9733F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">

    <div aria-hidden="true" style="position: absolute; left: 631px; top: 328px"><dc-import name="Prop" prop="thermos" size="52" anim="false" hint-size="52px,93px"></dc-import></div>

    <div style="position: absolute; left: 623px; top: 112px; color: #EEF6F0; font-family: 'Kithfield Hand', cursive; font-weight: 700; display: flex; flex-direction: column; gap: 1px; opacity: {{chalkOp}}; transition: opacity 300ms ease">

      <span style="font-size: 26px; text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 2px">{{chalk}}</span>
      <span style="font-size: 20px; opacity: 0.62">Landlord email</span>
      <span style="font-size: 20px; opacity: 0.42">Renew passport</span>
    </div>
    <sc-if value="{{lamp}}" hint-placeholder-val="{{ false }}">
      <div style="position: absolute; inset: 0; background: radial-gradient(circle at 800px 420px, rgba(255,214,140,0.0) 0, rgba(12,16,30,0.5) 260px, rgba(12,16,30,0.82) 620px)"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":1280},"h":{"editor":"int","default":800},"vx":{"editor":"int","default":0},"vy":{"editor":"int","default":0},"vw":{"editor":"int","default":1600},"mood":{"editor":"enum","options":["calm","over","grading","point","approve","clap","sleep","watch","think"],"default":"over"},"px":{"editor":"int","default":685},"py":{"editor":"int","default":196},"pace":{"editor":"boolean","default":false},"chalk":{"editor":"string","default":"Dentist email"},"lamp":{"editor":"boolean","default":false},"board":{"editor":"enum","options":["on","off"],"default":"on"},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    const P = this.props;
    const w = Number(P.w) || 1280, h = Number(P.h) || 800;
    const vx = Number(P.vx) || 0, vy = Number(P.vy) || 0, vw = Number(P.vw) || 1600;
    const s = w / vw;
    const pace = P.pace === true || P.pace === 'true';
    const lamp = P.lamp === true || P.lamp === 'true';
    const desk = (x, y, w2, h2, inset, top, legH) => ({ top: 'M' + (x + inset) + ' ' + (y - top) + ' L' + (x + w2 - inset) + ' ' + (y - top) + ' L' + (x + w2) + ' ' + y + ' L' + x + ' ' + y + ' Z', x, y, w: w2, h: h2, l1: x + 7, l2: x + w2 - 16, ly: y + h2, lh: legH });
    const desks = [];
    [275, 495, 715, 935, 1155].forEach((x) => desks.push(desk(x, 716, 190, 40, 10, 26, 40)));
    [143, 413, 683, 953, 1223].forEach((x) => desks.push(desk(x, 890, 234, 46, 12, 30, 44)));
    return {
      wpx: w + 'px', hpx: h + 'px',
      cam: 'scale(' + s.toFixed(4) + ') translate(' + (-vx) + 'px, ' + (-vy) + 'px)',
      wall: lamp ? '#E9DCC6' : '#FFF1DC',
      glass: lamp ? '#26304A' : '#CFE6F5',
      sun: lamp ? 0 : 1,
      night: 'none',
      mood: P.mood || 'over',
      walk: String(pace),
      px: (Number(P.px) || 685) + 'px', py: (Number(P.py) || 196) + 'px',
      paceCls: pace ? 'rm-pace' : '',
      chalk: P.chalk || 'Dentist email',
      chalkOp: P.chalk === 'none' || P.board === 'off' ? 0 : 1,
      onOp: P.board === 'off' ? 0 : 1,
      offOp: P.board === 'off' ? 1 : 0,
      date: 'Monday 26',
      lamp,
      desks
    };
  }
}
</script>
</body>
</html>
