  typescript: 6.0.3
  typescript-eslint: 8.70.1
  vitest: 5.0.2
  wrangler: 4.141.0
  zod: 4.6.5

# A native build may hold one copy of a native module: Expo's own packages take the pinned version.
overrides:
  # The Astro adapter's bundler plugin, held at the release that pairs with the pinned Wrangler.
  '@cloudflare/vite-plugin': 1.60.2
  expo-application: 'catalog:'
  expo-asset: 'catalog:'
  expo-constants: 'catalog:'
  expo-file-system: 'catalog:'
  expo-font: 'catalog:'
  expo-glass-effect: 'catalog:'

# pnpm refuses dependency install scripts unless they are listed here.
allowBuilds:
  '@parcel/watcher': false
  '@sentry/cli': true
  esbuild: true
  sharp: false
  workerd: true
