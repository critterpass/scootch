  '@astrojs/cloudflare': 14.3.3
  '@babel/core': 7.29.7
  '@bacons/apple-targets': 5.0.0
  '@cloudflare/vitest-pool-workers': 0.22.0
  '@cloudflare/workers-types': 5.20260926.1
  '@eslint/js': 10.0.1
  expo-application: 58.0.4
  expo-asset: 58.0.12
  expo-audio: 58.0.6
  expo-clipboard: 58.0.3
  expo-crypto: 58.0.5
  expo-device: 58.0.5
  expo-file-system: 58.0.6
  expo-font: 58.0.7
  expo-glass-effect: 58.0.3
  expo-localization: 58.0.3
  expo-media-library: 58.0.7
  expo-network: 58.0.3
  expo-sharing: 58.0.15
  expo-splash-screen: 58.0.6
  expo-store-review: 58.0.2
  '@napi-rs/canvas': 1.0.10
  '@playwright/test': 1.58.2
  astro: 7.3.5
  '@expo/log-box': 58.0.10
  '@expo/metro-runtime': 58.0.12
  '@expo/ui': 58.0.13
  '@jest/globals': 29.7.0
  '@nauverse/expo-cloud-settings': 1.3.4
  react-native-gesture-handler: 3.2.1
  react-native-reanimated: 4.7.0
  react-native-worklets: 0.13.0
  '@react-native/jest-preset': 0.88.0-rc.3
  '@react-native/metro-config': 0.88.0-rc.3
  '@sentry/react-native': 8.28.0
  '@shopify/react-native-skia': 2.13.1
  '@types/node': 26.6.3
  '@types/react': 19.3.0
  babel-preset-expo: 58.0.10
  eslint: 10.11.0
  eslint-config-prettier: 10.1.8
  expo: 58.0.5
  expo-apple-authentication: 58.0.2
  expo-build-properties: 58.0.10
  expo-constants: 58.0.10
  expo-dev-client: 58.0.11
  expo-doctor: 1.20.4
  expo-haptics: 58.0.5
  expo-linking: 58.0.11
  expo-notifications: 58.1.1
