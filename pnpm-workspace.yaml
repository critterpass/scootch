packages:
  - apps/*
  - packages/*
  - tools/*

saveExact: true

# One pinned version per shared dependency; workspace packages reference them as `catalog:`.
catalog:
  '@babel/core': 7.29.7
  '@eslint/js': 10.0.1
  '@expo/log-box': 58.0.6
  '@expo/metro-runtime': 58.0.8
  '@jest/globals': 29.7.0
  '@react-native/jest-preset': 0.88.0-rc.1
  '@react-native/metro-config': 0.88.0-rc.1
  '@types/node': 26.6.3
  '@types/react': 19.3.0
  babel-preset-expo: 58.0.4
  eslint: 10.11.0
  eslint-config-prettier: 10.1.8
  expo: 58.0.0-preview.7
  expo-build-properties: 58.0.8
  expo-constants: 58.0.8
  expo-dev-client: 58.0.8
  expo-doctor: 1.20.4
  expo-linking: 58.0.8
  expo-router: 58.0.9
  expo-sqlite: 58.0.6
  expo-system-ui: 58.0.3
  expo-updates: 58.0.10
  globals: 17.12.0
  jest: 29.7.0
  jest-expo: 58.0.4
  prettier: 3.9.9
  react: 19.3.0
  react-native: 0.88.0-rc.1
  react-native-safe-area-context: 5.9.1
  react-native-screens: 4.28.0
  tsx: 4.23.15
  typescript: 6.0.3
  typescript-eslint: 8.70.1
  vitest: 5.0.2
  zod: 4.6.5

# A native build may hold one copy of a native module: Expo's own packages take the pinned version.
overrides:
  expo-constants: 'catalog:'

# pnpm refuses dependency install scripts unless they are listed here.
allowBuilds:
  esbuild: true
