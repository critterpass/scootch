  expo-sqlite: 58.0.10
  expo-system-ui: 58.0.5
  expo-updates: 58.0.15
  fast-check: 4.10.2
  expo-web-browser: 58.0.6
  globals: 17.12.0
  jest: 29.7.0
  jest-expo: 58.0.7
  hono: 4.13.13
  playwright: 1.58.2
  prettier: 3.9.9
  react: 19.3.0
  react-native: 0.88.0-rc.3
  react-native-keychain: 10.0.0
  react-native-purchases: 10.11.0
  react-native-safe-area-context: 5.9.1
  react-native-screens: 4.28.0
