appId: com.phusclass.dev
---
# Captures the classroom's developer screen for the sheets beside the Phu, Prop, Room and App
# boards: the room at each camera shot, a pressure pose, and the pose and prop galleries. It opens
# the screen as the app comes up, as the registry capture does.
# On iOS the app opens the screen at launch, named by a launch argument, as the registry capture
# does; Android opens it by its link.
- launchApp:
    clearState: true
    arguments:
      openDeveloperScreen: /dev-classroom
- runFlow:
    when:
      platform: Android
    commands:
      # A clean install opens on the first day.
      - extendedWaitUntil:
          visible:
            id: 'first-day'
          timeout: 90000
      # Wait for the splash to be gone before the first tap, however slow the device.
      - extendedWaitUntil:
          notVisible:
            id: 'splash'
          timeout: 30000
      - openLink: phusclass-dev:///dev-classroom
- extendedWaitUntil:
    visible:
      id: 'dev-classroom-view'
    timeout: 90000
- extendedWaitUntil:
    notVisible:
      id: 'splash'
    timeout: 30000
# Long enough for the font and the first pictures.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: classroom-desk--en-light-default
- tapOn:
    id: 'dev-classroom-shot-session'
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: classroom-session--en-light-default
- tapOn:
    id: 'dev-classroom-pace'
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: classroom-session-pacing--en-light-default
- tapOn:
    id: 'dev-classroom-pace'
- tapOn:
    id: 'dev-classroom-shot-recess'
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: classroom-recess--en-light-default
- tapOn:
    id: 'dev-classroom-shot-desk'
- tapOn:
    id: 'dev-classroom-pressure-4'
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: classroom-desk-pressure-4--en-light-default
- tapOn:
    id: 'dev-classroom-lamp'
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: classroom-desk-lamp--en-light-default
- scrollUntilVisible:
    element:
      id: 'dev-classroom-pose-serious'
    direction: DOWN
- takeScreenshot: classroom-poses--en-light-default
- scrollUntilVisible:
    element:
      id: 'dev-classroom-props'
    direction: DOWN
- scroll
- takeScreenshot: classroom-props--en-light-default
