appId: app.scootch.dev
---
# Captures every registered screen state in every variant, for the design-beside-device sheets.
# Run it with mode=capture and flows=e2e/sheets. It reaches the registry the way a developer does,
# through the more button on the one screen, and reads the list from the app itself:
# `registry-count` holds the number of rows and `registry-name-<n>` the name of the n-th, so a new
# registry file needs no change here. Each image is named `<state id>--<variant>`.
- launchApp:
    clearState: true
# A clean install meets first launch before the one screen: say hello, keep the attitude and skip
# both favours. The developer tools then open from the more button in the top corner.
- extendedWaitUntil:
    visible:
      id: 'launch-hello-next'
    timeout: 90000
- tapOn:
    id: 'launch-hello-next'
- tapOn:
    id: 'launch-attitude-confirm'
- tapOn:
    id: 'launch-permission-skip'
- tapOn:
    id: 'launch-permission-skip'
- extendedWaitUntil:
    visible:
      id: 'more-button'
    timeout: 15000
- tapOn:
    id: 'more-button'
- scrollUntilVisible:
    element:
      id: 'developer-tools'
    direction: DOWN
- tapOn:
    id: 'developer-tools'
- extendedWaitUntil:
    visible:
      id: 'dev-open-registry'
    timeout: 15000
- tapOn:
    id: 'dev-open-registry'
- extendedWaitUntil:
    visible:
      id: 'registry-count'
    timeout: 15000
- copyTextFrom:
    id: 'registry-count'
- evalScript: ${output.count = Number(maestro.copiedText); output.row = 0}
- repeat:
    while:
      true: ${output.row < output.count}
    commands:
      - scrollUntilVisible:
          element:
            id: registry-name-${output.row}
          direction: DOWN
          timeout: 30000
          centerElement: true
      - copyTextFrom:
          id: registry-name-${output.row}
      - evalScript: ${output.name = maestro.copiedText}
      - tapOn:
          id: registry-row-${output.name}
      - extendedWaitUntil:
          visible:
            id: registry-state-${output.name}
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: ${output.name}
      # The way back is a strip over the status bar. The system keeps touches in the status bar
      # itself (the top 54 points, the island and the clock), so press the strip's lowest rows,
      # where it reaches below the status bar and before any control of the screen under it.
      - tapOn:
          point: '50%,7%'
      # The list keeps its place while a state is open, so its count has scrolled away by now: wait
      # for the list itself.
      - extendedWaitUntil:
          visible:
            id: 'registry-list'
          timeout: 15000
      - evalScript: ${output.row = output.row + 1}
