appId: com.phusclass.dev
---
# Captures every registered screen state in every variant, for the design-beside-device sheets.
# Run it with mode=capture and flows=e2e/sheets. It opens the registry as the app comes up, and reads
# the list from the app itself:
# `registry-count` holds the number of rows and `registry-name-<n>` the name of the n-th, so a new
# registry file needs no change here. Each image is named `<state id>--<variant>`.
# With MAESTRO_STATES (a comma-separated list of state id prefixes; the device workflow's `states`
# input) it captures only the rows whose name starts with one of them. With MAESTRO_VARIANTS (a
# comma-separated list of variant names, such as en-light-default; the `variants` input) it takes
# only those variants. Empty or unset: every row.
# On iOS the app opens the registry at launch, named by a launch argument: a link would stop on the
# system's prompt, and on a hosted simulator the link has reached the app only after the flow gave
# up on it. Android opens it by its link, which needs no prompt there.
- launchApp:
    clearState: true
    arguments:
      openDeveloperScreen: /registry
- runFlow:
    when:
      platform: Android
    commands:
      # A clean install opens on the first day.
      - extendedWaitUntil:
          visible:
            id: 'first-day'
          timeout: 90000
      # Wait for the splash to be gone before the first tap, however slow the device.
      - extendedWaitUntil:
          notVisible:
            id: 'splash'
          timeout: 30000
      - openLink: phusclass-dev:///registry
- extendedWaitUntil:
    visible:
      id: 'registry-count'
    timeout: 90000
# The splash plays over the registry too: wait for it to be gone before the first tap.
- extendedWaitUntil:
    notVisible:
      id: 'splash'
    timeout: 30000
- evalScript: "${output.states = typeof MAESTRO_STATES === 'undefined' ? '' : MAESTRO_STATES.trim()}"
- evalScript: "${output.variants = typeof MAESTRO_VARIANTS === 'undefined' ? '' : MAESTRO_VARIANTS.trim()}"
# The first time the keyboard is used, iOS may stop to explain sliding a finger across the letters,
# and what was typed before it came up is lost. So the words are typed, the notice is dismissed if
# it came up, and they are typed again whole; the check after the count then fails the run at once
# if the list is still not narrowed, instead of capturing everything until the time limit.
- runFlow:
    when:
      true: ${output.states !== ''}
    commands:
      - tapOn:
          id: 'registry-states'
      - inputText: ${output.states}
      - runFlow:
          when:
            visible: 'Continue'
          commands:
            - tapOn: 'Continue'
            - tapOn:
                id: 'registry-states'
            - eraseText: 400
            - inputText: ${output.states}
- runFlow:
    when:
      true: ${output.variants !== ''}
    commands:
      - tapOn:
          id: 'registry-variants'
      - inputText: ${output.variants}
      - runFlow:
          when:
            visible: 'Continue'
          commands:
            - tapOn: 'Continue'
            - tapOn:
                id: 'registry-variants'
            - eraseText: 400
            - inputText: ${output.variants}
# Closes the keyboard, which would otherwise cover the list.
- runFlow:
    when:
      true: ${output.states !== '' || output.variants !== ''}
    commands:
      - pressKey: Enter
- copyTextFrom:
    id: 'registry-count'
- evalScript: ${output.count = Number(maestro.copiedText); output.row = 0}
# Proof that the lists took effect: the first row must match them, or the run fails here.
- runFlow:
    when:
      true: ${output.states !== '' || output.variants !== ''}
    commands:
      - copyTextFrom:
          id: 'registry-name-0'
      - evalScript: |
          ${(function () {
            var name = maestro.copiedText;
            var states = output.states === '' ? [] : output.states.toLowerCase().split(',').map(function (s) { return s.trim(); }).filter(Boolean);
            var variants = output.variants === '' ? [] : output.variants.toLowerCase().split(',').map(function (s) { return s.trim(); }).filter(Boolean);
            var okState = states.length === 0 || states.some(function (s) { return name.indexOf(s) === 0; });
            var okVariant = variants.length === 0 || variants.some(function (v) { return name.slice(-v.length - 2) === '--' + v; });
            if (!okState || !okVariant) throw new Error('The list is not narrowed: first row is ' + name);
          })()}
- repeat:
    while:
      true: ${output.row < output.count}
    commands:
      - scrollUntilVisible:
          element:
            id: registry-name-${output.row}
          direction: DOWN
          timeout: 30000
          centerElement: true
      - copyTextFrom:
          id: registry-name-${output.row}
      - evalScript: ${output.name = maestro.copiedText}
      - tapOn:
          id: registry-row-${output.name}
      # A state drawn as a sheet is a window of its own, and the marker under it is then hidden
      # from the device: wait for the marker, and go on without it after eight seconds.
      - extendedWaitUntil:
          visible:
            id: registry-state-${output.name}
          timeout: 8000
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: ${output.name}
      # The way back is a strip over the status bar. The system keeps touches in the status bar
      # itself (the top 54 points, the island and the clock), so press the strip's lowest rows,
      # where it reaches below the status bar and before any control of the screen under it.
      - tapOn:
          point: '50%,7%'
      - waitForAnimationToEnd:
          timeout: 3000
      # With a sheet open the first press closes the sheet, and the second the state.
      - runFlow:
          when:
            notVisible:
              id: 'registry-list'
          commands:
            - tapOn:
                point: '50%,7%'
      # The list keeps its place while a state is open, so its count has scrolled away by now: wait
      # for the list itself.
      - extendedWaitUntil:
          visible:
            id: 'registry-list'
          timeout: 15000
      - evalScript: ${output.row = output.row + 1}
