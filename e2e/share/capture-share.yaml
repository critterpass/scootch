appId: com.phusclass.dev
---
# The share sheet's four cards, white-out on and off, beside the ShareCard and ShareSheet boards.
# Opens the registry by its link (as the sheets capture does), narrows it once to the share states
# and the variants wanted, and opens each row by its id. Ends by opening the share route itself for
# a finish that is not in the logbook: it must say there is nothing to share, and close.
- launchApp:
    clearState: true
# A clean install opens on the first day.
- extendedWaitUntil:
    visible:
      id: 'first-day'
    timeout: 90000
# Wait for the splash to be gone before the first tap, however slow the device.
- extendedWaitUntil:
    notVisible:
      id: 'splash'
    timeout: 30000
- openLink: phusclass-dev:///registry
# iOS asks before a link opens the app; its alert can take a moment to come up on a slow device.
- extendedWaitUntil:
    visible: 'Open'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'registry-count'
    timeout: 30000
- tapOn:
    id: 'registry-states'
- inputText: 'share-'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
      - tapOn:
          id: 'registry-states'
      - eraseText: 40
      - inputText: 'share-'
- tapOn:
    id: 'registry-variants'
- inputText: 'en-light-default,vi-light-default,en-light-largest,vi-light-default-long-text,en-dark-default'
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: 'registry-row-share-certificate--en-light-default'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'registry-row-share-certificate--en-light-default'
- extendedWaitUntil:
    visible:
      id: 'share-sheet'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: share-certificate--en-light-default
- tapOn:
    point: '50%,7%'
- extendedWaitUntil:
    visible:
      id: 'registry-list'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'registry-row-share-certificate--vi-light-default'
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: 'registry-row-share-certificate--vi-light-default'
- extendedWaitUntil:
    visible:
      id: 'share-sheet'
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: share-certificate--vi-light-default
- tapOn:
