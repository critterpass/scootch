appId: app.scootch.dev
---
# The fresh-user walk, between steps four and four-b: the camera, opened from home. It carries on
# from the step before it; nothing is cleared and nothing is seeded. The camera button sits beside
# the dock; it opens the camera's own page, which says why it wants the camera before the system
# is asked. A device run has no camera to photograph with, so the walk stops there and closes the
# camera again: home is as it was, and the next step types from it.
- extendedWaitUntil:
    visible:
      id: 'composer-camera'
    timeout: 30000
- takeScreenshot: camera-opening--en-light-default
# The screen never goes quiet, so the press does not wait for it to settle.
- tapOn:
    id: 'composer-camera'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'camera-screen'
    timeout: 15000
- assertVisible:
    id: 'camera-allow'
- takeScreenshot: camera-permission--en-light-default
- tapOn:
    id: 'camera-close'
- extendedWaitUntil:
    visible:
      id: 'composer-switch'
    timeout: 15000
- assertNotVisible:
    id: 'camera-screen'
