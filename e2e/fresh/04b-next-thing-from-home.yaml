appId: app.scootch.dev
---
# The fresh-user walk, between steps four and five: the first thing is finished and home says so,
# with the world card and the composer both on it and starts left under the free limit. It carries
# on from the step before it; nothing is cleared and nothing is seeded. The next thing is typed
# from home without leaving it: the world card steps aside as the keyboard comes up, and the thing
# goes the way the first did: the one thing that comes back, its hatch, and the task set.
- extendedWaitUntil:
    visible:
      id: 'world-row'
    timeout: 30000
- assertVisible:
    id: 'composer-switch'
- assertNotVisible:
    id: 'composer-locked'
- assertNotVisible:
    id: 'composer-spent'
- takeScreenshot: one-screen-done-for-today-with-composer--en-light-default
# The screen never goes quiet, so the press does not wait for it to settle.
- tapOn:
    id: 'composer-switch'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 15000
- tapOn:
    id: 'composer-input'
# The keyboard has the screen now: the world card is gone until the composer rests again.
- extendedWaitUntil:
    notVisible:
      id: 'world-row'
    timeout: 15000
- inputText: 'water the plants'
- takeScreenshot: fresh-04b-typing-from-home
- tapOn:
    id: 'composer-send'
# The battery question was asked with the first thing of the day: it is not asked again.
- extendedWaitUntil:
    visible:
      id: 'one-thing-accept'
    timeout: 60000
- tapOn:
    id: 'one-thing-accept'
- runFlow:
    when:
      visible:
        id: 'hatch-catch'
    commands:
      - tapOn:
          id: 'hatch-catch'
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 60000
- assertVisible:
    id: 'task-set-minutes-10'
- takeScreenshot: fresh-04b-second-task-set
