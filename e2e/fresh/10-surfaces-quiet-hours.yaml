appId: app.scootch.dev
---
# The fresh-user walk, step ten (b): what the monsters may send, and when they stay quiet. It
# carries on from the step before it, on home; nothing is cleared and nothing is seeded. Settings
# says how many messages the attitude allows a day; the quiet hours open on their sheet, move half
# an hour later and back, and the sheet closes keeping what it shows.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'more-button'
    timeout: 90000
- tapOn:
    id: 'more-button'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'settings'
      visible:
        id: 'more-button'
    commands:
      - tapOn:
          id: 'more-button'
          waitToSettleTimeoutMs: 0
          optional: true
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'settings-quiet-hours'
    direction: DOWN
- assertVisible:
    id: 'settings-monsters-message'
- takeScreenshot: fresh-10-settings-messages-and-quiet-hours
- tapOn:
    id: 'settings-quiet-hours'
- extendedWaitUntil:
    visible:
      id: 'quiet-hours'
    timeout: 15000
- assertVisible:
    id: 'settings-quiet-start'
- assertVisible:
    id: 'settings-quiet-end'
- takeScreenshot: fresh-10-quiet-hours
- copyTextFrom:
    id: 'settings-quiet-start'
- evalScript: ${output.quietStart = maestro.copiedText}
- tapOn:
    id: 'settings-quiet-start-later'
- assertNotVisible:
    id: 'settings-quiet-start'
    text: ${output.quietStart}
- takeScreenshot: fresh-10-quiet-hours-moved
- tapOn:
    id: 'settings-quiet-start-earlier'
- assertVisible:
    id: 'settings-quiet-start'
    text: ${output.quietStart}
- tapOn:
    id: 'quiet-hours-close'
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- tapOn:
    id: 'settings-close'
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 15000
