appId: app.scootch.dev
---
# The fresh-user walk, between steps four and five: the second thing is set and the person ends
# the day without doing it. It carries on from the step before it; nothing is cleared and nothing
# is seeded. "That's it for today" rests the day with the thing waiting for tomorrow, and it is
# still resting, and still waiting, after the app is closed and opened again.
- scrollUntilVisible:
    element:
      id: 'rest-today'
    direction: DOWN
    timeout: 30000
# The screen never goes quiet, so the press does not wait for it to settle.
- tapOn:
    id: 'rest-today'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'done-waiting'
    timeout: 30000
- assertNotVisible:
    id: 'one-action'
- takeScreenshot: one-screen-done-waiting-for-tomorrow--en-light-default
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: 'done-waiting'
    timeout: 90000
- assertVisible:
    id: 'world-row'
- takeScreenshot: fresh-04c-still-waiting-after-relaunch
