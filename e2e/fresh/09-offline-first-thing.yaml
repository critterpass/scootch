appId: app.scootch.dev
---
# The fresh-user walk with no connection. It carries on from the step before it; nothing is
# cleared and nothing is seeded. Run on its own, on a clean install, it first walks step one. A
# simulator cannot be taken offline, so the developer switch under the "Developer tools" row of
# Settings pretends there is none: the app's connection reader says offline and every API call
# fails as a network error. It is not in the store app. A thing is typed with the switch on: it
# comes back as the one thing with no monster and no joke about it, and a session runs and
# finishes on the phone alone, with the hatch note under the timer and no world piece yet. Then a
# heavy thing is typed, still offline: the phone's own gate holds it, and it gets the serious
# screen and its plain words, with no monster and nothing funny. With the switch off the app finds
# the connection by itself, and the held thing is screened at last.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'launch-hello-next'
    commands:
      - runFlow: 01-first-launch.yaml

# Settings, the way a developer reaches it: the pretend-offline switch, and the control that ends a
# session soon (a flow cannot wait ten minutes).
- tapOn:
    id: 'more-button'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'settings'
      visible:
        id: 'more-button'
    commands:
      - tapOn:
          id: 'more-button'
          waitToSettleTimeoutMs: 0
          optional: true
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'dev-pretend-offline'
    direction: DOWN
- tapOn:
    id: 'dev-pretend-offline'
- takeScreenshot: fresh-09-pretend-offline-on
- tapOn:
    id: 'developer-tools'
- extendedWaitUntil:
    visible:
      id: 'dev-short-session'
    timeout: 15000
- tapOn:
    id: 'dev-short-session'
- scrollUntilVisible:
    element:
      id: 'dev-close'
    direction: DOWN
- tapOn:
    id: 'dev-close'

# Home says it is offline and will sync later. Starting still works.
- extendedWaitUntil:
    visible:
      id: 'offline'
    timeout: 15000
- assertVisible: "Offline · I'll sync later"
- assertVisible:
    id: 'composer-talk'
- takeScreenshot: fresh-09-home-offline

# The first thing, typed.
- tapOn:
    id: 'composer-switch'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 15000
- tapOn:
    id: 'composer-input'
- inputText: 'email the dentist'
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- eraseText: 40
- inputText: 'email the dentist'
- tapOn:
    id: 'composer-send'
# The battery question comes with the first thing of the day, and only then.
- extendedWaitUntil:
    visible:
      id: 'energy-read'
    timeout: 8000
    optional: true
- runFlow:
    when:
      visible:
        id: 'energy-read'
    commands:
      - takeScreenshot: fresh-09-energy-offline
      - tapOn:
          id: 'energy-guess'
# With no connection the typed text comes back as it is, and Scootch says only that there is no
# signal: never a word about the thing itself.
- extendedWaitUntil:
    visible:
      id: 'one-thing-accept'
    timeout: 30000
- assertVisible: '(?i)no signal.*'
- assertVisible:
    id: 'offline'
- takeScreenshot: fresh-09-one-thing-offline
- tapOn:
    id: 'one-thing-accept'
# No monster hatches: the thing is set with Start, and the monster will come once it is screened.
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 30000
- assertNotVisible:
    id: 'hatch-catch'
- assertNotVisible:
    id: 'hatch-monster'
- assertVisible:
    id: 'task-set-minutes'
- assertVisible: "Your monster will hatch when we're back online\\."
- takeScreenshot: fresh-09-task-set-offline

# The session runs on the phone alone.
- tapOn:
    id: 'one-action'
- extendedWaitUntil:
    visible:
      id: 'session-running'
    timeout: 30000
- assertNotVisible:
    id: 'session-corner-monster'
# As the offline board draws it: the task's own words, and his note about the hatch under them,
# from the start. Never a plain line meant for something nobody has screened.
- extendedWaitUntil:
    visible:
      id: 'session-note'
    timeout: 15000
- assertVisible: "Your monster will hatch when we're back online\\."
- assertVisible:
    id: 'session-task'
- assertNotVisible: "I'll keep this one simple\\..*"
- takeScreenshot: fresh-09-session-offline
- tapOn:
    id: 'session-menu'
- extendedWaitUntil:
    visible:
      id: 'session-developer-end'
    timeout: 15000
- tapOn:
    id: 'session-developer-end'
- extendedWaitUntil:
    visible:
      id: 'session-finish-hold'
    timeout: 30000
# Time up says the same note over the hold.
- assertVisible: "Your monster will hatch when we're back online\\."
- assertNotVisible: "I'll keep this one simple\\..*"
- takeScreenshot: fresh-09-time-up-offline
- longPressOn:
    id: 'session-hold'
# The world piece and the bar arrive once the connection is back: nothing announces them now.
# Whatever else the finish gives with no connection is skipped through, back to home.
- extendedWaitUntil:
    visible:
      id: 'reveal-skip'
    timeout: 15000
    optional: true
- takeScreenshot: fresh-09-finished-offline
- assertNotVisible:
    id: 'reveal-piece'
- assertNotVisible:
    id: 'reveal-bar'
- assertNotVisible: '\+1 to your world'
- repeat:
    while:
      visible:
        id: 'reveal-skip'
    commands:
      - tapOn:
          id: 'reveal-skip'
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 30000
- assertVisible:
    id: 'offline'
- takeScreenshot: fresh-09-home-after-finish-offline

# Still offline, a heavy thing typed from home: the phone's own gate holds it before anything is
# sent.
- tapOn:
    id: 'composer-switch'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 15000
- tapOn:
    id: 'composer-input'
- inputText: 'book flowers for the funeral'
- takeScreenshot: fresh-09-heavy-typing-offline
- tapOn:
    id: 'composer-send'
# Held, it is not offered and celebrated: it gets the serious screen at once, as it would online,
# in the plain words of the offline pack. No burst, no monster, no wheel and no helpers.
- extendedWaitUntil:
    visible:
      id: 'serious-task'
    timeout: 30000
- assertVisible: "That sounds like a lot\\. I'll keep this one simple and quiet, and I'll sit with you\\."
- assertNotVisible:
    id: 'one-thing-accept'
- assertNotVisible:
    id: 'hatch-monster'
- assertNotVisible:
    id: 'hatch-catch'
- assertNotVisible: '(?i)no signal.*'
- assertNotVisible: "Your monster will hatch when we're back online\\."
- assertNotVisible:
    id: 'task-set-minutes'
- assertVisible:
    id: 'serious-sit'
- assertVisible:
    id: 'serious-not-today'
# "It's fine, be funny" waits for a screen: a thing nobody has screened might be a crisis.
- assertNotVisible:
    id: 'serious-be-funny'
- takeScreenshot: fresh-09-heavy-offered-offline

# The switch off: the connection is back, and the app finds it by itself.
- tapOn:
    id: 'more-button'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'settings'
      visible:
        id: 'more-button'
    commands:
      - tapOn:
          id: 'more-button'
          waitToSettleTimeoutMs: 0
          optional: true
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'dev-pretend-offline'
    direction: DOWN
- tapOn:
    id: 'dev-pretend-offline'
- tapOn:
    id: 'settings-close'
- extendedWaitUntil:
    notVisible:
      id: 'offline'
    timeout: 15000
- takeScreenshot: fresh-09-back-online
# The held thing is screened now the connection is back, and its own plain words arrive.
- extendedWaitUntil:
    visible:
      id: 'serious-task'
    timeout: 30000
    optional: true
- assertNotVisible:
    id: 'hatch-monster'
- takeScreenshot: fresh-09-back-online-screened
