appId: app.scootch.dev
---
# The fresh-user walk, between steps four and five: the first thing is finished and the home says
# so, with "One more" on it and starts left under the free limit. It carries on from the step
# before it; nothing is cleared and nothing is seeded. "One more" starts another thing the way the
# first was started: the composer, the thing that comes back, its hatch, and the task set.
- extendedWaitUntil:
    visible:
      id: 'one-more'
    timeout: 30000
- assertNotVisible:
    id: 'one-more-locked'
- takeScreenshot: one-screen-done-for-today-one-more--en-light-default
# The screen never goes quiet, so the press does not wait for it to settle: a second press by the
# runner would land on the composer that the first one opened.
- tapOn:
    id: 'one-more'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'composer-switch'
    timeout: 15000
- tapOn:
    id: 'composer-switch'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 15000
- tapOn:
    id: 'composer-input'
- inputText: 'water the plants'
- tapOn:
    id: 'composer-send'
# The battery question was asked with the first thing of the day: it is not asked again.
- extendedWaitUntil:
    visible:
      id: 'one-thing-accept'
    timeout: 60000
- tapOn:
    id: 'one-thing-accept'
- runFlow:
    when:
      visible:
        id: 'hatch-catch'
    commands:
      - tapOn:
          id: 'hatch-catch'
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 60000
- assertVisible:
    id: 'task-set-minutes-10'
- takeScreenshot: fresh-04b-second-task-set
