appId: app.scootch.dev
---
# The fresh-user walk, step four: what a finish leaves behind. It carries on from the step before
# it, on the first screen of the reveal; nothing is cleared, nothing is seeded and no link is
# opened. Each step of the reveal is skipped with one tap, the parked thought comes back, and then
# the world, the zoo, the caught card and the record are opened the way a person opens them.
- extendedWaitUntil:
    visible:
      id: 'reveal-skip'
    timeout: 30000
- takeScreenshot: fresh-04-reveal-first-step
# One tap skips a step. A finish gives two to four of them.
- repeat:
    while:
      visible:
        id: 'reveal-skip'
    commands:
      - tapOn:
          id: 'reveal-skip'
      - waitForAnimationToEnd
# The parked thought comes back only now.
- extendedWaitUntil:
    visible:
      id: 'session-parked-thoughts'
    timeout: 15000
- assertVisible: 'Bin bags'
- takeScreenshot: fresh-04-parked-thoughts
# Settling the last thought closes the list by itself: with nothing left to settle there is no
# "Done" to press, and home comes straight after.
- tapOn:
    id: 'session-thought-0-tomorrow'
- extendedWaitUntil:
    notVisible:
      id: 'session-parked-thoughts'
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 15000
- takeScreenshot: one-screen-done-for-today--en-light-default
# "Your world" on the finished day's home is pressed itself, the way the founder's phone does it:
# the row shows the world small, the world opens with today's monster on the island, and the
# record is opened from inside the world after it.
- tapOn:
    id: 'world-row'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'world-monster-0'
    timeout: 15000
- takeScreenshot: fresh-04-world-from-the-row
# The monster that was just caught lives on the island: pressing it opens its card, and closing
# the card comes back to the world. Scootch on the island never goes still, so the press does not
# wait for the screen to settle.
- tapOn:
    id: 'world-monster-0'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'zoo-card-face'
    timeout: 15000
- takeScreenshot: fresh-04-world-monster-card
- tapOn:
    id: 'zoo-card-close'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'world-island'
    timeout: 15000
- tapOn:
    id: 'world-open-record'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'record'
    timeout: 15000
- tapOn:
    id: 'record-close'
- tapOn:
    id: 'world-close'
- extendedWaitUntil:
    visible:
      id: 'world-row'
    timeout: 15000
# The world: one finished thing lives there.
- tapOn:
    id: 'world-button'
- extendedWaitUntil:
    visible:
      id: 'world'
    timeout: 15000
- assertVisible:
    id: 'world-island'
- assertVisible:
    id: 'world-sentence'
- assertNotVisible:
    id: 'world-empty'
- takeScreenshot: fresh-04-world
# The zoo, and the caught card at full size.
- tapOn:
    id: 'world-open-zoo'
- extendedWaitUntil:
    visible:
      id: 'zoo'
    timeout: 15000
# The shelf: this month's page above it, and the binder's other orders tagged Plus.
- assertVisible:
    id: 'binder-month'
- assertVisible:
    id: 'binder-sort-longest'
- takeScreenshot: zoo-binder--en-light-default
- tapOn:
    id: 'zoo-tile-0'
- extendedWaitUntil:
    visible:
      id: 'zoo-card-face'
    timeout: 15000
- takeScreenshot: fresh-04-caught-card
# The card turns over for its field notes, and back.
- tapOn:
    id: 'binder-card-flip'
    waitToSettleTimeoutMs: 0
- takeScreenshot: fresh-04-caught-card-field-notes
- tapOn:
    id: 'binder-card-flip'
    waitToSettleTimeoutMs: 0
- tapOn:
    id: 'zoo-card-close'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'zoo'
    timeout: 15000
- tapOn:
    id: 'zoo-close'
# The record: today's bar is on it.
- extendedWaitUntil:
    visible:
      id: 'world-open-record'
    timeout: 15000
- tapOn:
    id: 'world-open-record'
- extendedWaitUntil:
    visible:
      id: 'record'
    timeout: 15000
- assertVisible:
    id: 'record-play'
- assertVisible:
    id: 'record-keep'
- takeScreenshot: fresh-04-record
- tapOn:
    id: 'record-close'
- tapOn:
    id: 'world-close'
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 15000
