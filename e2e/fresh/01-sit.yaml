appId: com.phusclass.dev
---
# The fresh-user walk, step one: a clean install opens on the desk in the classroom, with nothing
# on it yet, and he finds an empty board suspicious. No seed, no deep link, nothing granted
# beforehand.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'desk'
    timeout: 90000
- assertVisible: 'Your desk is clear.'
- assertVisible:
    id: 'composer-hold'
# Long enough for the room's pictures and the handwriting.
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: desk-empty--en-light-default
