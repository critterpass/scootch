appId: app.scootch.dev
---
# The fresh-user walk, step eight: words that need real help. It carries on from the step before
# it, on home; nothing is cleared and nothing is seeded. The words name no explicit phrase, so the
# phone's gate lets them through and the server's screen calls the crisis. The care screen takes
# over: every task is hidden, the helplines for the phone's region come first, and there is no
# monster, joke, card, share or burst. "Just sit with me" asks nothing. The cross closes it, the
# day comes back in plain company, and the helplines are one tap from Settings.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'composer'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'composer-switch'
    commands:
      - tapOn:
          id: 'composer-switch'
          waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 15000
- tapOn:
    id: 'composer-input'
- inputText: 'Honestly everyone would be better off without me, I just need to sort my stuff out before I go'
- tapOn:
    id: 'composer-send'
- runFlow:
    when:
      visible:
        id: 'energy-read'
    commands:
      - tapOn:
          id: 'energy-guess'
# Nothing funny while the words wait for the screen.
- assertNotVisible:
    id: 'hatch'
- assertNotVisible:
    id: 'dump-reveal'
- extendedWaitUntil:
    visible:
      id: 'care-screen'
    timeout: 60000
- assertVisible: 'You don’t have to do anything right now.'
# Real help first: the phone region's own lines, the emergency number on top. The region is the
# phone's (the United States on a fresh simulator, Vietnam on a Mac set to Vietnam), so the walk
# looks for a line to call, not a number.
- assertVisible: 'Call [0-9][0-9 ]* · .*'
- assertVisible:
    id: 'care-close'
- assertNotVisible:
    id: 'one-action'
- assertNotVisible:
    id: 'task-text'
- assertNotVisible:
    id: 'composer'
- assertNotVisible:
    id: 'hatch'
- assertNotVisible:
    id: 'hatch-monster'
- assertNotVisible:
    id: 'one-thing-accept'
- assertNotVisible:
    id: 'share'
- assertNotVisible:
    id: 'session-start-burst'
- takeScreenshot: fresh-08-crisis
- scrollUntilVisible:
    element:
      id: 'care-sit'
    direction: DOWN
- assertVisible:
    id: 'care-find-helpline'
- assertVisible:
    id: 'care-text-someone'
- takeScreenshot: fresh-08-crisis-below
# "Just sit with me": the sentence changes, nothing is asked, and the helplines stay.
- tapOn:
    id: 'care-sit'
- extendedWaitUntil:
    notVisible:
      id: 'care-sit'
    timeout: 15000
- assertVisible:
    id: 'care-screen'
- scrollUntilVisible:
    element:
      text: 'Call [0-9][0-9 ]* · .*'
    direction: UP
- takeScreenshot: fresh-08-crisis-sitting
# Closing it asks nothing. The day is back, with no monster and nothing sold.
- scrollUntilVisible:
    element:
      id: 'care-close'
    direction: UP
- tapOn:
    id: 'care-close'
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 30000
- assertNotVisible:
    id: 'care-screen'
- assertNotVisible:
    id: 'hatch'
- assertNotVisible:
    id: 'hatch-monster'
- assertNotVisible:
    id: 'share'
- assertNotVisible:
    id: 'composer-locked'
# The day rests on plain words: never the attitude's joke for the end of the day.
- assertNotVisible: '.*Go do absolutely nothing.*'
- assertNotVisible: '.*Go and rest\. I.ll keep things cosy here.*'
- takeScreenshot: fresh-08-after-closing
# The helplines stay one tap from Settings.
- tapOn:
    id: 'more-button'
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'settings'
      visible:
        id: 'more-button'
    commands:
      - tapOn:
          id: 'more-button'
          waitToSettleTimeoutMs: 0
          optional: true
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'settings-helplines'
    direction: DOWN
- tapOn:
    id: 'settings-helplines'
- extendedWaitUntil:
    visible:
      id: 'helplines'
    timeout: 15000
- assertVisible: 'Call [0-9][0-9 ]* · .*'
- takeScreenshot: fresh-08-helplines-from-settings
- tapOn:
    id: 'helplines-close'
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'settings-close'
    direction: UP
- tapOn:
    id: 'settings-close'
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 15000
- assertNotVisible: '.*Go do absolutely nothing.*'
