appId: app.scootch.dev
---
# The fresh-user walk, step one: a clean install meets first launch and walks through it the way a
# new person does. Hello, the attitude as it stands, and "Not now" to both favours, so the system
# is never asked for anything. It ends on the warm-up ask. No seed, no deep link, nothing granted
# beforehand.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'launch-hello-next'
    timeout: 90000
- assertVisible:
    id: 'one-sentence'
- takeScreenshot: launch-hello--en-light-default
- tapOn:
    id: 'launch-hello-next'
- extendedWaitUntil:
    visible:
      id: 'launch-attitude-confirm'
    timeout: 15000
- assertVisible:
    id: 'launch-attitude-cheeky'
- takeScreenshot: launch-attitude--en-light-default
- tapOn:
    id: 'launch-attitude-confirm'
- extendedWaitUntil:
    visible:
      id: 'launch-permission-skip'
    timeout: 15000
- takeScreenshot: launch-permissions--en-light-default
# Notifications, then the microphone: each skipped.
# A press that comes while the first favour is being answered is lost, so the skip is pressed
# again for as long as it is still there, and only then: once the warm-up ask has taken its place
# there is nothing to press.
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            visible:
              id: 'launch-permission-skip'
          commands:
            - tapOn:
                id: 'launch-permission-skip'
                optional: true
            - waitForAnimationToEnd:
                timeout: 2500
- extendedWaitUntil:
    visible:
      id: 'warm-up-chip-0'
    timeout: 15000
- assertVisible:
    id: 'one-sentence'
- assertVisible:
    id: 'composer-talk'
- assertNotVisible:
    id: 'launch-hello-next'
- takeScreenshot: launch-first-one-thing--en-light-default
