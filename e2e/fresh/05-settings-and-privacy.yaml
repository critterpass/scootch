appId: app.scootch.dev
---
# The fresh-user walk, step five: Settings and privacy. It runs on the install the steps before it
# left; nothing is cleared and nothing is seeded. The more button opens Settings, the
# attitude is changed, and "Delete everything" is started and then turned down with "Keep
# everything", so nothing is deleted.
# The app is opened again, without clearing anything, so this step starts on the one screen
# wherever the step before it stopped.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'more-button'
    timeout: 90000
- tapOn:
    id: 'more-button'
    waitToSettleTimeoutMs: 0
# Settings slides in: wait for it before judging the press. Only a press that was really lost
# (the button still there, Settings still not) is made again; never a blind second tap.
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'settings'
      visible:
        id: 'more-button'
    commands:
      - tapOn:
          id: 'more-button'
          waitToSettleTimeoutMs: 0
          optional: true
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- takeScreenshot: settings-page--en-light-default
- tapOn:
    id: 'settings-attitude-soft'
# The app icon follows the attitude, so iOS announces the new icon.
- runFlow: ../tour-support/icon-changed.yaml
- assertVisible:
    id: 'settings-attitude-note'
- takeScreenshot: fresh-05-attitude-soft
# Tables live behind one row. A fresh phone has never signed in: the row reads "Off", and its page
# says so and offers the sign-in, with the two switches a seat follows already there.
- scrollUntilVisible:
    element:
      id: 'settings-tables'
    direction: DOWN
- assertVisible: 'Off'
- tapOn:
    id: 'settings-tables'
- extendedWaitUntil:
    visible:
      id: 'table-settings-off'
    timeout: 15000
- assertVisible:
    id: 'table-settings-sign-in'
- assertVisible:
    id: 'table-settings-show-label'
- takeScreenshot: table-settings-signed-out--en-light-default
- tapOn:
    id: 'table-settings-close'
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'settings-privacy'
    direction: DOWN
- tapOn:
    id: 'settings-privacy'
- extendedWaitUntil:
    visible:
      id: 'privacy'
    timeout: 15000
- assertVisible:
    id: 'privacy-keep-transcripts'
- takeScreenshot: privacy-and-data--en-light-default
- tapOn:
    id: 'privacy-delete'
- extendedWaitUntil:
    visible:
      id: 'delete-keep'
    timeout: 15000
- takeScreenshot: privacy-delete-everything--en-light-default
- tapOn:
    id: 'delete-keep'
# Nothing was deleted: the page is as it was.
- assertVisible:
    id: 'privacy-export'
- tapOn:
    id: 'privacy-close'
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- tapOn:
    id: 'settings-close'
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 15000
# Settings and the world are the pages either side of home: a swipe goes to each and back, with
# no button pressed. The swipe starts in the middle of the screen, away from both edges.
- swipe:
    start: 80%, 45%
    end: 20%, 45%
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- takeScreenshot: fresh-05-settings-by-swipe
- swipe:
    start: 20%, 45%
    end: 80%, 45%
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 15000
- swipe:
    start: 20%, 45%
    end: 80%, 45%
- extendedWaitUntil:
    visible:
      id: 'world-island'
    timeout: 15000
- takeScreenshot: fresh-05-world-by-swipe
- swipe:
    start: 80%, 45%
    end: 20%, 45%
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 15000
