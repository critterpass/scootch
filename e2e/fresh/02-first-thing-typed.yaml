appId: app.scootch.dev
---
# The fresh-user walk, step two, on the install step one left behind. The app is started again
# without clearing anything: first launch must not come back. Then the first thing is typed and
# sent: the battery question is answered, the one thing comes back and is taken, its monster
# hatches and is caught, and the screen must show the task set with Start. The microphone was
# skipped, so nothing here touches it.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'composer-talk'
    timeout: 90000
- assertNotVisible:
    id: 'launch-hello-next'
- tapOn:
    id: 'composer-switch'
- extendedWaitUntil:
    visible:
      id: 'composer-input'
    timeout: 15000
- tapOn:
    id: 'composer-input'
- inputText: 'reply to one message'
# The first time the keyboard is used, iOS may stop to explain sliding a finger across the letters,
# and what was typed before it came up is lost: dismiss it, then type the words again whole.
- runFlow:
    when:
      visible: 'Continue'
    commands:
      - tapOn: 'Continue'
- eraseText: 40
- inputText: 'reply to one message'
- takeScreenshot: fresh-02-typing
- tapOn:
    id: 'composer-send'
# The first words of the day wait for the battery question.
- extendedWaitUntil:
    visible:
      id: 'energy-read'
    timeout: 15000
- takeScreenshot: dump-energy-read--en-light-default
# "Anything in the way?" sits under the battery. An answer is Scootch's to answer, and a second
# tap would take it back; it goes with the words when the battery is read.
- assertVisible: 'Anything in the way\?'
- tapOn:
    id: 'in-the-way-scary'
- takeScreenshot: dump-energy-in-the-way-answered--en-light-default
- tapOn:
    id: 'energy-guess'
# With or without a connection the typed text comes back as today's one thing.
- extendedWaitUntil:
    visible:
      id: 'one-thing-accept'
    timeout: 60000
- assertVisible:
    id: 'one-thing'
- takeScreenshot: dump-one-thing--en-light-default
- tapOn:
    id: 'one-thing-accept'
# An ordinary task hatches, and "Catch him" sets it. With no connection there is no monster yet
# and no hatch: the pick lands on the set task by itself.
- runFlow:
    when:
      visible:
        id: 'hatch-catch'
    commands:
      - takeScreenshot: monster-hatched--en-light-default
      - tapOn:
          id: 'hatch-catch'
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 60000
- assertVisible:
    id: 'task-set-minutes-10'
- assertNotVisible:
    id: 'composer-input'
# A plain task never gets the serious voice.
- assertNotVisible: 'That sounds like a lot.*'
- takeScreenshot: one-screen-task-set--en-light-default
# Under the wheel one quiet line says when this length would end; turning the wheel leaves it there.
- assertVisible:
    id: 'task-set-ends-at'
- assertVisible: 'Ends at .*'
# The Guess chip opens "How long would this take?". Skip keeps nothing: the chip still asks.
- tapOn:
    id: 'task-set-guess'
- extendedWaitUntil:
    visible:
      id: 'guess-skip'
    timeout: 15000
- assertVisible: 'How long would this take\?'
- assertVisible: 'A guess, before you start.'
- assertVisible: 'Guess 2 hours'
- takeScreenshot: one-screen-task-set-guess-sheet--en-light-default
- tapOn:
    id: 'guess-skip'
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 15000
- assertVisible: 'Guess'
# Asked again and answered: the button says the guess back, and so does the chip afterwards.
- tapOn:
    id: 'task-set-guess'
- extendedWaitUntil:
    visible:
      id: 'guess-confirm'
    timeout: 15000
- tapOn:
    id: 'guess-step-60'
- assertVisible: 'Guess 1 hour'
- tapOn:
    id: 'guess-confirm'
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 15000
- assertVisible: '1 hour'
- takeScreenshot: one-screen-task-set-guess-made--en-light-default
# The When chip opens "When should I bring it back?". A moment picked, the chip reads it back and
# the dock holds Start now and Save for later; saved, the thing stays set with its one message.
- tapOn:
    id: 'task-set-when'
- extendedWaitUntil:
    visible:
      id: 'when-confirm'
    timeout: 15000
- assertVisible: 'When should I bring it back\?'
- tapOn:
    id: 'when-moment-dinner'
- assertVisible: 'Bring it back after dinner'
- takeScreenshot: one-screen-task-set-when-sheet--en-light-default
- tapOn:
    id: 'when-confirm'
- extendedWaitUntil:
    visible:
      id: 'task-set-save'
    timeout: 15000
- assertVisible: 'After dinner'
- assertVisible: 'Start now'
- takeScreenshot: one-screen-task-set-when-picked--en-light-default
- tapOn:
    id: 'task-set-save'
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 15000
- assertNotVisible:
    id: 'task-set-save'
- assertVisible: 'After dinner'
# The bites are offered only when the thing's pack has them, so without a connection, or before
# the pack is in, there is no button. With one, the first bite is ticked and the note counts it;
# the last tick would open the catch, which the next step reaches from Start instead.
- runFlow:
    when:
      visible:
        id: 'task-set-bites'
    commands:
      - tapOn:
          id: 'task-set-bites'
      - extendedWaitUntil:
          visible:
            id: 'bites-note'
          timeout: 15000
      - assertVisible: 'Start with the first one.'
      - tapOn:
          id: 'bite-0'
      # The tick's own mark sits inside the row, which iOS reads as one element: the note proves it.
      - extendedWaitUntil:
          visible: "1 down. Tick the next when it's done."
          timeout: 15000
      - takeScreenshot: one-screen-task-set-bites-sheet--en-light-default
      # A tap on the shade above the sheet closes it.
      - tapOn:
          point: '50%,8%'
      - extendedWaitUntil:
          visible:
            id: 'one-action'
          timeout: 15000
# Company is a choice on the set task, under the length. "At a table" turns the one action into
# "Start at a table" and says what a table is shown; "Alone" puts the plain Start back, which the
# next step taps. No table is opened and no account is asked for here.
- scrollUntilVisible:
    element:
      id: 'task-set-company-table'
    direction: DOWN
- tapOn:
    id: 'task-set-company-table'
- assertVisible:
    id: 'task-set-company-note'
- assertVisible: 'Start at a table'
- takeScreenshot: one-screen-task-set-at-table--en-light-default
- tapOn:
    id: 'task-set-company-alone'
- assertNotVisible:
    id: 'task-set-company-note'
- assertNotVisible: 'Start at a table'
# "Haunt a friend" opens as a sheet. A fresh phone has no friend: the sheet says how one is made,
# and "Not now" closes it and leaves the task as it was.
- scrollUntilVisible:
    element:
      id: 'haunt-a-friend'
    direction: DOWN
- tapOn:
    id: 'haunt-a-friend'
- extendedWaitUntil:
    visible:
      id: 'haunt-not-now'
    timeout: 15000
- assertVisible:
    id: 'haunt-send-close'
# With nobody to haunt yet the sheet says what a haunt is, and offers the link that makes a friend.
- assertVisible:
    id: 'haunt-guide'
- takeScreenshot: fresh-02-haunt-sheet-no-friends
- tapOn:
    id: 'haunt-send-close'
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 15000
