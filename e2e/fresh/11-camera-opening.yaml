appId: app.scootch.dev
---
# The fresh-user walk, step eleven: the camera. It carries on from the step before it, on home;
# nothing is cleared and nothing is seeded. Home has no camera button, so the camera is opened by
# its link. It says why it wants the camera before the system is asked; the system is answered
# yes. A simulator has no camera: its shutter hands over a plain generated picture, so Desk finds
# nothing in it, and Paper asks before any words leave the phone. "Not now" sends nothing.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 90000
- runFlow:
    when:
      visible:
        id: 'launch-hello-next'
    commands:
      - runFlow: 01-first-launch.yaml
- assertNotVisible:
    id: 'composer-camera'
- openLink: scootch-dev://camera
# iOS asks before a link opens its app.
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: 'camera-screen'
    timeout: 30000
# Where the system has not been asked yet, the camera says why it wants it first; a simulator,
# which has no camera, is never asked and opens straight on the viewfinder.
- runFlow:
    when:
      visible:
        id: 'camera-allow'
    commands:
      - takeScreenshot: fresh-11-camera-permission
      - tapOn:
          id: 'camera-allow'
      - runFlow:
          when:
            visible: 'Allow'
          commands:
            - tapOn: 'Allow'
      - runFlow:
          when:
            visible: 'OK'
          commands:
            - tapOn: 'OK'
- extendedWaitUntil:
    visible:
      id: 'camera-shutter'
    timeout: 15000
- assertVisible:
    id: 'camera-line'
- assertVisible:
    id: 'camera-mode-desk'
- assertVisible:
    id: 'camera-mode-paper'
- assertVisible:
    id: 'camera-mode-screen'
- assertVisible:
    id: 'camera-mode-room'
- takeScreenshot: fresh-11-camera-viewfinder-desk
# Desk reads the picture on the phone.
- tapOn:
    id: 'camera-shutter'
- extendedWaitUntil:
    visible:
      id: 'camera-retake'
    timeout: 30000
- takeScreenshot: fresh-11-camera-desk-read
- tapOn:
    id: 'camera-retake'
- extendedWaitUntil:
    visible:
      id: 'camera-shutter'
    timeout: 15000
# Paper, with its one free try: the first photo asks before its words leave the phone.
- tapOn:
    id: 'camera-mode-paper'
- takeScreenshot: fresh-11-camera-viewfinder-paper
- tapOn:
    id: 'camera-shutter'
- extendedWaitUntil:
    visible:
      id: 'camera-consent'
    timeout: 30000
- takeScreenshot: fresh-11-camera-paper-asks-first
- tapOn:
    id: 'camera-consent-not-now'
- extendedWaitUntil:
    visible:
      id: 'camera-shutter'
    timeout: 15000
- assertNotVisible:
    id: 'camera-consent'
# Asked again, the words are read.
- tapOn:
    id: 'camera-shutter'
- extendedWaitUntil:
    visible:
      id: 'camera-consent'
    timeout: 30000
- tapOn:
    id: 'camera-consent-read-it'
- extendedWaitUntil:
    visible:
      id: 'camera-retake'
    timeout: 60000
- takeScreenshot: fresh-11-camera-paper-read
- tapOn:
    id: 'camera-retake'
- extendedWaitUntil:
    visible:
      id: 'camera-shutter'
    timeout: 15000
- takeScreenshot: fresh-11-camera-after-paper
- tapOn:
    id: 'camera-close'
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 15000
- assertNotVisible:
    id: 'camera-screen'
