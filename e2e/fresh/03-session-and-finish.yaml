appId: app.scootch.dev
---
# The fresh-user walk, step three: from a set task, start a session, park a thought, swap Scootch
# and the monster and back, and finish by holding. It ends on the first screen of the reveal. It carries on from the step before it, on the one screen with today's one thing
# set; nothing is cleared and nothing is seeded. A flow cannot wait ten minutes, so it turns on the
# developer control that ends the running session's timer in a few seconds. That control is reached
# the way a developer reaches it, through the "Developer tools" row of Settings, and is not in the
# store app.
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 90000
# Who a session opens on is a setting: Settings, then "Catch with". Hold opens it on Scootch.
- tapOn:
    id: 'more-button'
    waitToSettleTimeoutMs: 0
# Settings slides in: wait for it before judging the press. Only a press that was really lost
# (the button still there, Settings still not) is made again; never a blind second tap.
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible:
        id: 'settings'
      visible:
        id: 'more-button'
    commands:
      - tapOn:
          id: 'more-button'
          waitToSettleTimeoutMs: 0
          optional: true
- extendedWaitUntil:
    visible:
      id: 'settings'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'settings-finish-with'
    direction: DOWN
- tapOn:
    id: 'settings-finish-with'
- extendedWaitUntil:
    visible:
      id: 'finish-with-hold'
    timeout: 15000
- takeScreenshot: fresh-03-catch-with
- tapOn:
    id: 'finish-with-hold'
- takeScreenshot: fresh-03-catch-with-hold
- tapOn:
    id: 'finish-with-close'
# The developer tools are the last row of Settings in the developer app.
- scrollUntilVisible:
    element:
      id: 'developer-tools'
    direction: DOWN
- tapOn:
    id: 'developer-tools'
- extendedWaitUntil:
    visible:
      id: 'dev-short-session'
    timeout: 15000
- tapOn:
    id: 'dev-short-session'
- scrollUntilVisible:
    element:
      id: 'dev-close'
    direction: DOWN
- tapOn:
    id: 'dev-close'
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 15000
# Start. The session screen takes over and the burst goes quiet by itself.
- tapOn:
    id: 'one-action'
- extendedWaitUntil:
    visible:
      id: 'session-running'
    timeout: 30000
- assertVisible:
    id: 'session-minutes'
- takeScreenshot: session-running--en-light-default
# Park a thought: one tap, a few words, and back to work.
- tapOn:
    id: 'session-park'
# The field opens as hold-to-talk where the phone can listen: the keyboard is one tap away.
- extendedWaitUntil:
    visible:
      id: 'session-park-composer'
    timeout: 15000
- takeScreenshot: fresh-03-park-a-thought
- runFlow:
    when:
      notVisible:
        id: 'session-park-input'
    commands:
      - tapOn:
          id: 'session-park-switch'
- extendedWaitUntil:
    visible:
      id: 'session-park-input'
    timeout: 15000
- inputText: 'Bin bags'
- takeScreenshot: fresh-03-park-a-thought-keyboard
- tapOn:
    id: 'session-park-save'
# The "Parked" note only shows for a few seconds and a tap on this screen returns later than that
# (the countdown never lets the screen go quiet), so the proof is that the field has closed; the
# thought itself comes back in the next step.
- extendedWaitUntil:
    notVisible:
      id: 'session-park-input'
    timeout: 15000
- takeScreenshot: fresh-03-thought-parked
# Where the task has a monster that can be caught, it sits in the corner: a tap swaps the two, so
# the monster and its catch take the screen and Scootch the corner, and a second tap swaps back.
- runFlow:
    when:
      visible:
        id: 'session-corner-monster'
    commands:
      - tapOn:
          id: 'session-scootch-button'
      - extendedWaitUntil:
          visible:
            id: 'session-catch-setting'
          timeout: 15000
      - takeScreenshot: fresh-03-swapped-to-the-monster
      - tapOn:
          id: 'session-scootch-button'
      - extendedWaitUntil:
          visible:
            id: 'session-running'
          timeout: 15000
      - takeScreenshot: fresh-03-swapped-back-to-scootch
# Time is up a few seconds after the developer control is pressed. It lives in the corner menu,
# with everything else that is not the work itself.
- tapOn:
    id: 'session-menu'
- extendedWaitUntil:
    visible:
      id: 'session-developer-end'
    timeout: 15000
- assertVisible:
    id: 'session-stuck'
- takeScreenshot: fresh-03-session-menu
- tapOn:
    id: 'session-developer-end'
# The disc shrinks with the time left: a second after the end is pulled in, it is nearly gone.
- takeScreenshot: fresh-03-session-disc-late
- extendedWaitUntil:
    visible:
      id: 'session-finish-hold'
    timeout: 30000
- assertNotVisible: 'That sounds like a lot.*'
- takeScreenshot: fresh-03-time-up
# Hold until the ring is full: it fills in under two seconds, and a long press is held for longer.
- longPressOn:
    id: 'session-hold'
# What the finish gave is shown next: the walk carries on in the step after this one.
- extendedWaitUntil:
    visible:
      id: 'reveal-skip'
    timeout: 15000
- takeScreenshot: fresh-03-finished
