appId: app.scootch.dev
---
# The fresh-user walk, step three: from a set task, start a session, park a thought, and finish by
# tapping twice. It carries on from the step before it, on the one screen with today's one thing
# set; nothing is cleared and nothing is seeded. A flow cannot wait ten minutes, so it turns on the
# developer control that ends the running session's timer in a few seconds. That control is reached
# the way a developer reaches it, through the "Developer tools" entry, and is not in the store app.
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 90000
- tapOn:
    id: 'developer-tools'
- extendedWaitUntil:
    visible:
      id: 'dev-short-session'
    timeout: 15000
# Finishing with two taps is a setting. Until the Settings screen exists its switch lives here.
- tapOn:
    id: 'dev-finish-tap-twice'
- tapOn:
    id: 'dev-short-session'
- scrollUntilVisible:
    element:
      id: 'dev-close'
    direction: DOWN
- tapOn:
    id: 'dev-close'
- extendedWaitUntil:
    visible:
      id: 'one-action'
    timeout: 15000
# Start. The session screen takes over and the burst goes quiet by itself.
- tapOn:
    id: 'one-action'
- extendedWaitUntil:
    visible:
      id: 'session-running'
    timeout: 30000
- assertVisible:
    id: 'session-minutes'
- takeScreenshot: fresh-03-session-running
# Park a thought: one tap, a few words, and back to work.
- tapOn:
    id: 'session-park'
- extendedWaitUntil:
    visible:
      id: 'session-park-input'
    timeout: 15000
- inputText: 'Bin bags'
- takeScreenshot: fresh-03-park-a-thought-keyboard
- tapOn:
    id: 'session-park-save'
- extendedWaitUntil:
    visible:
      id: 'session-parked-note'
    timeout: 15000
- takeScreenshot: fresh-03-thought-parked
# Time is up a few seconds after the developer control is pressed.
- tapOn:
    id: 'session-developer-end'
- extendedWaitUntil:
    visible:
      id: 'session-finish-tap'
    timeout: 30000
- takeScreenshot: fresh-03-time-up
# Tap, then tap again to confirm.
- tapOn:
    id: 'session-finish-tap-button'
- assertVisible:
    id: 'session-finish-tap-button'
- tapOn:
    id: 'session-finish-tap-button'
# The parked thought comes back only now.
- extendedWaitUntil:
    visible:
      id: 'session-moment-done'
    timeout: 15000
- takeScreenshot: fresh-03-caught
- tapOn:
    id: 'session-moment-done'
- extendedWaitUntil:
    visible:
      id: 'session-parked-thoughts'
    timeout: 15000
- assertVisible: 'Bin bags'
- takeScreenshot: fresh-03-parked-thoughts
- tapOn:
    id: 'session-thought-0-tomorrow'
- tapOn:
    id: 'session-thoughts-done'
- extendedWaitUntil:
    visible:
      id: 'one-sentence'
    timeout: 15000
- takeScreenshot: fresh-03-back-on-the-one-screen
