appId: com.phusclass.dev
# fold: closed
---
# The desk and a running period on iPhone Duo in English and Vietnamese, closed, flat and half open,
# at the default and the largest text size, for the design-beside-device sheets (MODE=capture, on a
# Mac with agent-device). Each registered state stays on screen while the device folds. Opened out,
# the board's page beside the desk is the state's own board, as its wall shows. English goes first:
# a state opened straight after another language's can show that language for a moment. Needs a
# device with two displays; elsewhere it stops at once.
- assertTrue: ${typeof DUO_FOLD_URL !== 'undefined'}
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'first-day'
    timeout: 90000
- runFlow:
    file: ../common/duo-registry-state.yaml
    env:
      STATE: desk-waiting--en-light-largest
- runFlow:
    file: ../common/duo-registry-state.yaml
    env:
      STATE: desk-waiting--en-light-default
- runFlow:
    file: ../common/duo-registry-state.yaml
    env:
      STATE: session-running--en-light-default
- runFlow:
    file: ../common/duo-registry-state.yaml
    env:
      STATE: desk-waiting--vi-light-default
- runFlow:
    file: ../common/duo-registry-state.yaml
    env:
      STATE: session-running--vi-light-default
- runFlow:
    file: ../common/duo-registry-state.yaml
    env:
      STATE: desk-waiting--vi-light-largest
