appId: app.scootch.dev
---
# iOS says so, in an alert of its own, each time an app changes its icon: the icon follows the
# attitude unless it is pinned. This waits a moment for that alert and answers it. Where there is
# none (Android, or an icon that did not change) it does nothing.
- extendedWaitUntil:
    visible: 'OK'
    timeout: 6000
    optional: true
- runFlow:
    when:
      visible: 'OK'
    commands:
      - tapOn: 'OK'
