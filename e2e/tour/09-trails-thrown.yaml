appId: app.scootch.dev
---
# Tour: each trail thrown, on the studio's own stage. From a clean install the studio is opened
# from Settings, the way a person opens it; each trail is picked and caught again, and a capture is
# taken while its marks are in the air.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: 'launch-hello-next'
    timeout: 90000
- tapOn:
    id: 'launch-hello-next'
- tapOn:
    id: 'launch-attitude-confirm'
- repeat:
    times: 4
    commands:
      - runFlow:
          when:
            notVisible:
              id: 'more-button'
          commands:
            - tapOn:
                id: 'launch-permission-skip'
            - waitForAnimationToEnd:
                timeout: 2000
- extendedWaitUntil:
    visible:
      id: 'more-button'
    timeout: 15000
- tapOn:
    id: 'more-button'
    waitToSettleTimeoutMs: 0
- runFlow:
    when:
      notVisible:
        id: 'settings'
    commands:
      - tapOn:
          id: 'more-button'
          waitToSettleTimeoutMs: 0
- scrollUntilVisible:
    element:
      id: 'settings-studio'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'settings-studio'
- extendedWaitUntil:
    visible:
      id: 'studio-tab-trail'
    timeout: 15000
- tapOn:
    id: 'studio-tab-trail'
- extendedWaitUntil:
    visible:
      id: 'studio-preview'
    timeout: 15000
- runFlow:
    file: ../tour-support/trail-thrown.yaml
    env:
      TRAIL: confetti
- runFlow:
    file: ../tour-support/trail-thrown.yaml
    env:
      TRAIL: stardust
- runFlow:
    file: ../tour-support/trail-thrown.yaml
    env:
      TRAIL: bubbles
- runFlow:
    file: ../tour-support/trail-thrown.yaml
    env:
      TRAIL: splat
