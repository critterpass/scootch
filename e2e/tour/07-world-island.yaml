appId: app.scootch.dev
---
# Tour: the world as one island, at every size the registry has, in light and dark and in both
# languages, then the largest text size and the finished day's row that leads to it. Each shot is
# a registry row, named for the sheet that pairs it with its design.
- runFlow: ../tour-support/to-registry.yaml
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: world-empty--en-light-default
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: world-empty--en-dark-default
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: world-empty--vi-light-default
