appId: app.scootch.dev
---
# Tour: the drawer sheet empty, with three things (one of them heavy) and with twelve, in both languages, dark and at the largest text,
# home on a finished day with the composer open, locked at the free limit and spent, and the task set with its discard button.
- runFlow: ../tour-support/to-registry.yaml
- runFlow:
    file: ../tour-support/shot-drawer.yaml
    env:
      NAME: drawer-empty--en-light-default
- runFlow:
    file: ../tour-support/shot-drawer.yaml
    env:
      NAME: drawer-empty--vi-light-default
- runFlow:
    file: ../tour-support/shot-drawer.yaml
    env:
      NAME: drawer-three--en-light-default
- runFlow:
    file: ../tour-support/shot-drawer.yaml
    env:
      NAME: drawer-three--vi-light-default
- runFlow:
    file: ../tour-support/shot-drawer.yaml
    env:
      NAME: drawer-three--en-dark-default
- runFlow:
    file: ../tour-support/shot-drawer.yaml
    env:
      NAME: drawer-three--en-light-largest
- runFlow:
    file: ../tour-support/shot-drawer.yaml
    env:
      NAME: drawer-twelve--en-light-default
      EXPAND: yes
- runFlow:
    file: ../tour-support/shot-drawer.yaml
    env:
      NAME: drawer-twelve--vi-light-default
- runFlow:
    file: ../tour-support/shot-drawer.yaml
    env:
      NAME: drawer-twelve--en-light-largest
- runFlow:
    file: ../tour-support/shot-drawer.yaml
    env:
      NAME: dump-peek-in-the-drawer--en-light-default
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-done-for-today--en-light-default
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-done-for-today--vi-light-default
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-done-for-today--en-light-largest
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-starts-locked--en-light-default
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-starts-locked--vi-light-default
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-starts-locked--en-dark-default
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-starts-locked--en-light-largest
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-starts-spent--en-light-default
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-starts-spent--en-light-largest
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-task-set--en-light-default
- runFlow:
    file: ../tour-support/shot.yaml
    env:
      NAME: one-screen-task-set--en-light-largest
# Is character motion running in the exported bundle? The app is opened again on the one screen
# and captured six times a second apart; the captures are compared pixel by pixel afterwards.
- launchApp
- extendedWaitUntil:
    visible:
      id: 'composer-talk'
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: motion-proof-1
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: motion-proof-2
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: motion-proof-3
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: motion-proof-4
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: motion-proof-5
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: motion-proof-6
