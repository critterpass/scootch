# Deploys main to the dev environment: the API (database migrations first) and the website.
# Every commit on main has already passed `ci passed` as a pull request, so this does not wait for
# the push's own checks. Production is never deployed from here.
name: deploy dev

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order: a migration must never race the one before it.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        working-directory: apps/api
        run: pnpm exec wrangler d1 migrations apply scootch-dev --env dev --remote
      - name: Deploy the API
        working-directory: apps/api
        run: pnpm exec wrangler deploy --env dev --var "COMMIT_SHA:${GITHUB_SHA::7}"
      - name: Wait until dev serves this commit
        run: |
          for attempt in $(seq 1 20); do
            got=$(curl -s --max-time 10 https://scootch-dev.bkdev98.workers.dev/v1/health || true)
            case "$got" in *"\"commit\":\"${GITHUB_SHA::7}\""*) echo "$got"; exit 0 ;; esac
            sleep 3
          done
          echo "::error::dev does not serve ${GITHUB_SHA::7}: $got"
          exit 1

  web:
    runs-on: ubuntu-latest
    needs: api
    env:
      CLOUDFLARE_ENV: dev
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Bundle the site for dev
        working-directory: apps/web
        run: pnpm exec astro build
      - name: Deploy the site
        working-directory: apps/web
        run: pnpm exec wrangler deploy
